services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: grading
      POSTGRES_USER: grading
      POSTGRES_PASSWORD: grading
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - grading_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grading -d grading"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: db
      DB_NAME: grading
      DB_USER: grading
      DB_PASSWORD: grading
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    ports:
      - "8080:80"
  automark:
    build: ./automark
    depends_on:
      - backend
      - db
    profiles:
      - debug

volumes:
  grading_db_data:
